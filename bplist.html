<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">

    <title>bplist</title>




    <style>
        * { box-sizing: border-box; }

        body {
            display: grid;
            grid-template-columns: 1fr 1fr;

        }

        .col > fieldset {
            min-height: 98vh;
            min-height: 98svh;

            display: flex;
            flex-direction: column;
        }

        .col textarea {
            width: 100%;
            margin-block-start: 1em;

            flex: 1;
        }

        button.action {
            margin-block-end: 2em;
            width: 100%;
        }

        input {
            margin-block-end: 0.5em;
            width: 50%;
        }
    </style>




    <script>
        // ref: https://developer.mozilla.org/en-US/docs/Web/API/HTML_Drag_and_Drop_API/File_drag_and_drop
        window.addEventListener("drop", (e) => {
            e.preventDefault();

            const dropText = e.dataTransfer.getData('text/plain')
            if (dropText && dropText.trim()) {
                document.querySelector("form").querySelector("textarea#input").value += dropText;
            }
        });

        window.addEventListener("dragover", (e) => {
            const acceptedItems = [...e.dataTransfer.items].filter((item) =>
                item.type === "text/plain"
                || item.type === "image/png"
                || item.type === "image/jpeg"
            );

            if (acceptedItems.length > 0) {
                e.preventDefault();
            }
        });
    </script>

    <script>
        window.addEventListener("load", (e) => {
            const form = document.querySelector("form");
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                parseForm(e.target);
            });

            const save = document.querySelector("button#save");
            save.addEventListener("click", (e) => {
                const content = document.querySelector("textarea#output").value;
                const blob = new Blob([content], { type: 'octet/stream' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);

                const title = JSON.parse(content)?.playlistTitle;
                const time = new Date().toISOString();
                const fileName = title ? `${time} - ${title}` : time;
                link.download = `${fileName}.bplist`

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            });
        });

        function parseForm(form) {
            const title = form.querySelector("input#title")?.value;
            const author = form.querySelector("input#author")?.value;
            const description = form.querySelector("input#description")?.value;
            const input = form.querySelector("textarea#input")?.value;

            const keys = parseBeatSaverKeys(input);
            const json = construct(title, author, description, keys)
            const output = JSON.stringify(json, null, 2)
            document.querySelector("textarea#output").value = output;
        }
    </script>

    <script>
        function parseBeatSaverKeys(text) {
            const regex = /(?:https?:\/\/)?(?:www\.)?beatsaver\.com\/maps\/([a-fA-F0-9]+)/g;

            return [...text.matchAll(regex)].map(match => match[1]);
        }

        function construct(title, author, description, keys) {
            const result = {
                playlistTitle: title,
                playlistAuthor: author,
                playlistDescription: description,
                songs: keys.map(key => ({key: key})),
                image: ""
            }

            return result;
        }
    </script>
</head>

<body>
    <form class="col input">
        <fieldset>
            <legend><label for="input">input</label></legend>

            <button type="submit" class="action">convert</button>

            <div>
                <input id="title" type="text">
                <label for="title">← playlist title</label>
            </div>
            <div>
                <input id="author" type="text">
                <label for="author">← playlist author</label>
            </div>
            <div>
                <input id="description" type="text">
                <label for="description">← playlist description</label>
            </div>

            <textarea id="input" spellcheck="false" rows="10" cols="60" autofocus placeholder="https://beatsaver.com/maps/4a9f1"></textarea>
        </fieldset>
    </form>

    <div class="col output">
        <fieldset>
            <legend><label for="output">output</label></legend>

            <button type="button" id="save" class="action">save</button>

            <textarea id="output"spellcheck="false"  rows="10" cols="60" readonly></textarea>
        </fieldset>
    </div>
</body>

</html>
